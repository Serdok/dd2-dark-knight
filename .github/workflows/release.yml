name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches modinfo.ini version
        id: version
        run: |
          modinfo=$(find DarkKnight -name modinfo.ini | head -n1)
          version=$(grep -E '^version=' "$modinfo" | cut -d= -f2 | tr -d '[:space:]')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match modinfo.ini version $version"
            exit 1
          fi
          echo "zip=DarkKnight-v$version.zip" >> "$GITHUB_OUTPUT"

      - name: Package
        run: cd DarkKnight && zip -r "../${{ steps.version.outputs.zip }}" .

      - name: Read tag annotation
        run: |
          # actions/checkout may not fetch the annotated tag object, so fetch it explicitly
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
            git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > notes.md
          else
            echo "::warning::$GITHUB_REF_NAME is a lightweight tag, no annotation to include"
            : > notes.md
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # The API prepends --notes-file content to the auto-generated notes
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.version.outputs.zip }}" --notes-file notes.md --generate-notes
